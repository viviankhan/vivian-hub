# Supabase project config (see https://supabase.com/docs/guides/cli/config).
# The only thing pinned here is the calendar proxy: it must run WITHOUT JWT
# verification so the browser's CORS preflight (which carries no auth header)
# isn't rejected before the function runs. The function is a read-only URL
# fetcher with SSRF guards, so it's safe to leave open.
[functions.ics-proxy]
verify_jwt = false

# The "paste an event" parser runs without JWT verification for the same reason
# — the browser's CORS preflight carries no auth header. It only calls Gemini
# with your server-side key and returns structured JSON; it never touches the
# database.
[functions.parse-event]
verify_jwt = false

# The receipt scanner (B&B tracker) runs without JWT verification for the same
# reason — the browser's CORS preflight carries no auth header. It only sends the
# photo to Gemini with your server-side key and returns structured JSON; it never
# touches the database.
[functions.parse-receipt]
verify_jwt = false

# Papers: PDF → walkthrough. Off for the CORS preflight like parse-event; the
# function checks the caller's session itself, since a PDF is a costly call.
# It only calls Gemini and returns JSON; it never touches the database.
[functions.paper-walkthrough]
verify_jwt = false

# Papers: wake the narrator Action. The function checks the caller's session
# itself (see its source), so the preflight can pass without a JWT.
[functions.narrate-now]
verify_jwt = false
