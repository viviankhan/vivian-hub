name: Narrate papers

# Renders audio for papers in Supabase that don't have it yet (see PAPERS.md).
# Commits nothing: it reads the queue from Supabase and writes the audio and
# cues straight back there.
#
# Runs every 15 minutes, on demand from the Actions tab, and immediately when
# the app pings the `narrate-now` Edge Function after you add a paper.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [narrate]

permissions:
  contents: read

# One narrator at a time, so two runs never render the same paper. A trigger
# that arrives mid-run waits and then sweeps anything the first run missed.
concurrency:
  group: narrate
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VOICE_MODEL: ${{ github.workspace }}/.voices/en_GB-alba-medium.onnx
    steps:
      - uses: actions/checkout@v4

      # Cheap check first: most runs find nothing to do and stop here, before
      # installing anything.
      - id: queue
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY secret is not set; nothing to do."
            echo "work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/narrate/worker.py check

      - if: steps.queue.outputs.work == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/narrate/requirements.txt

      - if: steps.queue.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-voice-en_GB-alba-medium

      - if: steps.queue.outputs.work == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r scripts/narrate/requirements.txt
          [ -f .voices/en_GB-alba-medium.onnx ] || python3 -m piper.download_voices en_GB-alba-medium --data-dir .voices

      - if: steps.queue.outputs.work == 'true'
        run: python3 scripts/narrate/worker.py run
